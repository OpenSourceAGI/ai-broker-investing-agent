name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.action != 'closed' &&
      (github.actor == 'claude[bot]' ||
       github.actor == 'anthropic-claude[bot]' ||
       github.actor == 'vtempest')
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      - name: Auto-approve
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  delete-branch:
    runs-on: ubuntu-latest
    # Only branches of this repository can be deleted from here; a fork's
    # branch belongs to its owner.
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete head branch
        # There is no checkout in this job, so use the API instead of
        # `git push`. The branch name comes in through `env` so it is never
        # interpolated into the script.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Deleting branch $BRANCH"
          gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$BRANCH"             || echo "Branch $BRANCH was already deleted."
